[package]
name = "ultragraph"
version = "0.9.9"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

repository = "https://github.com/deepcausality/deep_causality.rs"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>", ]
description = "Hypergraph data structure."
documentation = "https://docs.rs/ultragraph"
homepage = "https://github.com/deepcausality/deep_causality/tree/main/ultragraph"
categories = ["data-structures"]
keywords = ["data-structures"]
exclude = [
    "*.bazel",
    "*/*.bazel",
    "*.bazel.*",
    "BUILD",
    "BUILD.bazel",
    "MODULE.bazel",
    ".bazelignore",
    ".bazelrc",
    "papers/*",
]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
no-std = ["alloc"]
# Temporary: each selects one challenger of ultragraph-live-state-maintained-views for the
# storage measurement, the snapshot-log edge arrays or the Vec lists indexed on high-degree
# nodes; off, the per-node Vec lists are used; both at once do not build. Leave with the decision.
edge-log = []
edge-index = []

[dependencies.ultragraph_traits]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
deep_causality_rand = { path = "../deep_causality_unified_math/deep_causality_rand" }

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "ultragraph_example"
path = "examples/ultraph_example.rs"

[lints]
workspace = true
